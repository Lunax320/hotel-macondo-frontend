<div
  class="bg-white rounded-xl p-4 md:px-6 md:py-4 shadow-[0_4px_20px_rgba(0,0,0,0.07)] flex items-center gap-6 flex-wrap mb-7"
>
  <div class="flex items-center gap-2">
    <i class="bi bi-search text-gray-400"></i>
    <span class="font-sans text-sm font-semibold text-gray-600">Estado:</span>
  </div>

  <div class="flex gap-2 flex-wrap">
    <button
      type="button"
      (click)="seleccionar('TODOS')"
      class="font-sans text-xs font-semibold px-4 py-1.5 rounded-full border-2 transition-all cursor-pointer"
      [class]="
        filtroSeleccionado === 'TODOS'
          ? 'border-[var(--azul)] bg-[var(--azul)] text-white'
          : 'border-gray-100 text-gray-500 hover:border-[var(--azul)] bg-transparent'
      "
    >
      Todos
    </button>
    <button
      type="button"
      (click)="seleccionar('ACTIVA')"
      class="font-sans text-xs font-semibold px-4 py-1.5 rounded-full border-2 transition-all cursor-pointer"
      [class]="
        filtroSeleccionado === 'ACTIVA'
          ? 'border-[var(--azul)] bg-[var(--azul)] text-white'
          : 'border-gray-100 text-gray-500 hover:border-[var(--azul)] bg-transparent'
      "
    >
      Activa
    </button>
    <button
      type="button"
      (click)="seleccionar('CONFIRMADA')"
      class="font-sans text-xs font-semibold px-4 py-1.5 rounded-full border-2 transition-all cursor-pointer"
      [class]="
        filtroSeleccionado === 'CONFIRMADA'
          ? 'border-[var(--azul)] bg-[var(--azul)] text-white'
          : 'border-gray-100 text-gray-500 hover:border-[var(--azul)] bg-transparent'
      "
    >
      Confirmada
    </button>
    <button
      type="button"
      (click)="seleccionar('PENDIENTE')"
      class="font-sans text-xs font-semibold px-4 py-1.5 rounded-full border-2 transition-all cursor-pointer"
      [class]="
        filtroSeleccionado === 'PENDIENTE'
          ? 'border-[var(--azul)] bg-[var(--azul)] text-white'
          : 'border-gray-100 text-gray-500 hover:border-[var(--azul)] bg-transparent'
      "
    >
      Pendiente
    </button>
  </div>
</div>
