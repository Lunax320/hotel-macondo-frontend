<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-xs"
  role="dialog"
  aria-modal="true"
  aria-labelledby="titulo-tipo-habitacion"
>
  <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl md:p-8">
    <div class="mb-6 flex items-center justify-between">
      <h2
        class="font-serif text-2xl font-bold text-[var(--azul-oscuro)]"
        id="titulo-tipo-habitacion"
      >
        @if (tipoHabitacion()) {
          Editar Tipo de Habitación
        } @else {
          Nuevo Tipo de Habitación
        }
      </h2>
      <button
        class="text-2xl font-light leading-none text-gray-400 hover:text-gray-600"
        type="button"
        aria-label="Cerrar formulario"
        (click)="cancelar()"
      >
        &times;
      </button>
    </div>

    @if (mensajeError()) {
      <div
        class="mb-4 rounded-lg border border-red-200 bg-red-50 px-5 py-4 text-red-700"
        role="alert"
      >
        {{ mensajeError() }}
      </div>
    }

    <form class="space-y-4" [formGroup]="tipoHabitacionForm" (ngSubmit)="guardar()">
      <app-tipo-habitacion-campos-basicos
        [formulario]="tipoHabitacionForm"
      ></app-tipo-habitacion-campos-basicos>
      <app-tipo-habitacion-campos-detalle
        [formulario]="tipoHabitacionForm"
      ></app-tipo-habitacion-campos-detalle>

      <div class="flex justify-end gap-3 border-t border-gray-100 pt-4">
        <button
          class="rounded-lg px-5 py-2.5 text-sm font-semibold text-gray-600 transition hover:bg-gray-100"
          type="button"
          (click)="cancelar()"
        >
          Cancelar
        </button>
        <button
          class="rounded-lg bg-[var(--dorado)] px-6 py-2.5 text-sm font-bold text-[var(--azul-oscuro)] transition hover:bg-[var(--dorado-oscuro)] disabled:cursor-not-allowed disabled:opacity-50"
          type="submit"
          [disabled]="tipoHabitacionForm.invalid"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
