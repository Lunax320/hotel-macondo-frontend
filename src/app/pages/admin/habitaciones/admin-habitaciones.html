<div class="flex flex-col bg-white md:flex-row">
  <app-admin-sidebar seccionActiva="habitaciones"></app-admin-sidebar>

  <section class="min-w-0 flex-1 p-6 md:p-10">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <header>
        <h1 class="font-serif text-3xl font-bold text-[var(--azul-oscuro)] md:text-4xl">
          Habitaciones
        </h1>
        <p class="mt-1 text-[var(--texto)]">
          Inventario del hotel: crear, editar, visualizar y retirar habitaciones.
        </p>
      </header>

      <a
        class="inline-flex min-h-12 shrink-0 items-center justify-center gap-2 rounded-xl bg-[var(--azul-oscuro)] px-5 font-bold text-white transition hover:bg-[var(--azul)] sm:self-end"
        routerLink="/admin/habitaciones/nueva"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span>Nueva habitación</span>
      </a>
    </div>

    @if (errorHabitacion) {
      <div
        class="mb-4 rounded-lg border border-red-200 bg-red-50 px-5 py-4 text-red-700"
        role="alert"
      >
        {{ errorHabitacion }}
      </div>
    }

    @if (habitacionPendienteEliminar; as habitacion) {
      <app-confirmacion-accion
        [titulo]="'¿Eliminar ' + habitacion.nombre + '?'"
        mensaje="Esta acción no se puede deshacer."
        textoConfirmar="Confirmar eliminación"
        textoCancelar="Cancelar"
        (confirmado)="confirmarEliminacion()"
        (cancelado)="cancelarEliminacion()"
      ></app-confirmacion-accion>
    }

    @if (habitacionPendienteEstado; as habitacion) {
      <app-confirmacion-accion
        [titulo]="
          (habitacion.estado === 'DISPONIBLE' ? '¿Deshabilitar ' : '¿Habilitar ') +
          habitacion.nombre +
          '?'
        "
        [mensaje]="
          habitacion.estado === 'DISPONIBLE'
            ? 'No se podrá reservar hasta que se habilite de nuevo.'
            : 'Volverá a estar disponible para reservar.'
        "
        [textoConfirmar]="habitacion.estado === 'DISPONIBLE' ? 'Confirmar deshabilitación' : 'Confirmar habilitación'"
        textoCancelar="Cancelar"
        (confirmado)="confirmarEstado()"
        (cancelado)="cancelarEstado()"
      ></app-confirmacion-accion>
    }

    <app-habitacion-table
      [habitaciones]="habitaciones"
      [cargaFallida]="!!errorHabitacion"
      (cambioEstadoSolicitado)="cambiarEstado($event)"
      (eliminacionSolicitada)="solicitarEliminacion($event)"
    ></app-habitacion-table>
  </section>
</div>
