@if (habitacion().tipoHabitacion.id) {
  <a
    class="btn-secundario inline-block rounded-lg h-8 inline-flex items-center px-3 text-sm font-medium"
    [routerLink]="['/habitaciones', habitacion().tipoHabitacion.id]"
    target="_blank"
  >
    Ver
  </a>
}
<a
  class="btn-secundario ml-2 inline-block rounded-lg h-8 inline-flex items-center px-3 text-sm font-medium"
  [routerLink]="['/admin/habitaciones/editar', habitacion().id]"
>
  Editar
</a>
<button
  class="btn-secundario-borde ml-2 inline-block rounded-lg h-8 inline-flex items-center px-3 text-sm font-medium"
  type="button"
  (click)="cambioEstadoSolicitado.emit(habitacion())"
>
  {{ habitacion().estado === 'DISPONIBLE' ? 'Deshabilitar' : 'Habilitar' }}
</button>
<button
  class="btn-destructivo ml-2 rounded-lg h-8 inline-flex items-center px-3 text-sm font-medium"
  type="button"
  (click)="eliminacionSolicitada.emit(habitacion())"
>
  Eliminar
</button>
