<div class="mt-8 flex flex-wrap gap-4">
  <button
    class="btn-primario rounded-lg h-12 px-8 font-bold"
    type="submit"
    [disabled]="deshabilitado()"
  >
    @if (esEdicion()) {
      Guardar cambios
    } @else {
      Crear habitación
    }
  </button>
  <a
    class="btn-secundario-borde rounded-lg px-8 py-3 font-bold"
    [routerLink]="rutaCancelar()"
  >
    Cancelar
  </a>
</div>
