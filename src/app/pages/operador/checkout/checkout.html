<div class="flex min-h-screen flex-col bg-white font-sans text-[var(--texto)] md:flex-row">
  <app-operador-sidebar></app-operador-sidebar>

  <main class="min-w-0 flex-1 overflow-y-auto p-6 md:p-10">
    <header class="mb-8 border-b border-gray-200 pb-4">
      <h1 class="font-serif text-3xl font-bold text-[var(--azul-oscuro)] md:text-4xl">
        Check-out — Habitación {{ habitacionId }}
      </h1>
      <p class="mt-1 text-sm font-medium text-gray-500">Finalización de estadía — Portal operador</p>
    </header>

    @if (mensaje) {
      <p class="mb-6 max-w-4xl rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800" role="status">
        {{ mensaje }}
      </p>
    }
    @if (mensajeError) {
      <p class="mb-6 max-w-4xl rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">
        {{ mensajeError }}
      </p>
    }

    <div class="flex max-w-4xl flex-col gap-8">
      @if (reserva) {
        <app-checkout-estadia [reserva]="reserva"></app-checkout-estadia>
        <app-checkout-consumos [reserva]="reserva"></app-checkout-consumos>
        <app-checkout-pago
          [cuenta]="reserva.cuenta ?? null"
          [procesando]="procesando"
          (pagar)="pagar($event)"
        ></app-checkout-pago>
        <app-checkout-verificaciones
          [cuentaPagada]="cuentaSaldada"
          [reservaActiva]="reserva.estado === 'ACTIVA'"
          [procesando]="procesando"
          (finalizar)="finalizar()"
        ></app-checkout-verificaciones>
      } @else if (!mensajeError) {
        <p class="text-sm text-gray-500" role="status">Cargando la reserva...</p>
      }

      <a routerLink="/operador" class="inline-flex items-center gap-2 text-sm font-semibold text-[var(--azul)] hover:underline">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al panel
      </a>
    </div>
  </main>
</div>
