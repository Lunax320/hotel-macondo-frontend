<article
  class="flex h-full flex-col justify-between rounded-2xl border border-gray-100 bg-white p-6 shadow-sm transition hover:shadow-md"
>
  <div>
    <div
      class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-amber-50 text-xl text-amber-600"
    >
      <i class="bi bi-receipt" aria-hidden="true"></i>
    </div>
    <h3 class="mb-2 font-serif text-xl font-bold text-[var(--azul-oscuro)]">Cuenta Habitación</h3>
    <p class="mb-6 text-sm text-gray-500">
      Ingresa el número de habitación para cargar o consultar consumos adicionales de los huéspedes.
    </p>
  </div>

  <form action="/operador/cuenta/buscar" method="get" class="space-y-3">
    <div>
      <label
        for="habitacionId"
        class="mb-1 block text-[0.68rem] font-bold uppercase tracking-wider text-gray-400"
      >
        Número de Habitación / ID
      </label>
      <input
        type="text"
        id="habitacionId"
        name="id"
        placeholder="Ej: 301"
        required
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm text-[var(--texto)] focus:border-[var(--azul)] focus:outline-none"
      />
    </div>
    <button
      type="submit"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--dorado)] px-4 py-2.5 text-center text-sm font-bold text-[var(--azul-oscuro)] transition-all hover:bg-[var(--dorado-oscuro)]"
    >
      <i class="bi bi-search" aria-hidden="true"></i>
      <span>Buscar Cuenta</span>
    </button>
  </form>
</article>
