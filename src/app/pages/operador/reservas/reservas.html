<div class="flex min-h-screen flex-col bg-white text-[var(--texto)] md:flex-row">
  <app-operador-sidebar></app-operador-sidebar>

  <main class="min-w-0 flex-1 p-6 md:p-10">
    <header class="mb-8">
      <h1 class="font-serif text-3xl font-bold text-[var(--azul-oscuro)] md:text-4xl">Reservas</h1>
      <p class="mt-1 text-[var(--texto)]">Reservas registradas en el hotel y su estado actual.</p>
    </header>

    @if (mensajeCancelacion) {
      <p
        class="mb-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800"
        role="status"
      >
        {{ mensajeCancelacion }}
      </p>
    }

    @if (errorCancelacion) {
      <p class="mb-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        {{ errorCancelacion }}
      </p>
    }

    @if (errorCarga) {
      <p class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        {{ errorCarga }}
      </p>
    }

    <app-reservas-estadisticas [reservas]="reservas"></app-reservas-estadisticas>
    <app-reservas-tabla
      [reservas]="reservas"
      [cancelandoNumero]="cancelandoNumero"
      (cancelacionSolicitada)="cancelarReserva($event)"
    ></app-reservas-tabla>
  </main>
</div>
