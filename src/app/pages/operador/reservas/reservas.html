<div class="flex min-h-screen flex-col bg-white text-[var(--texto)] md:flex-row">
  <app-operador-sidebar></app-operador-sidebar>

  <main class="min-w-0 flex-1 p-6 md:p-10">
    <header class="mb-8">
      <h1 class="font-serif text-3xl font-bold text-[var(--azul-oscuro)] md:text-4xl">Reservas</h1>
      <p class="mt-1 text-[var(--texto)]">Reservas registradas en el hotel y su estado actual.</p>
    </header>

    @if (errorAccion) {
      <p
        class="mb-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800"
        role="alert"
      >
        {{ errorAccion }}
      </p>
      <button
        type="button"
        class="btn-secundario mb-5 rounded-lg px-5 py-2.5 text-sm font-semibold"
        [disabled]="cargando || cambiandoNumero !== null"
        (click)="cargarReservas()"
      >
        Volver a consultar
      </button>
    }

    @if (cargando) {
      <p class="rounded-xl border border-gray-200 bg-white p-4 text-sm text-gray-600" role="status">
        Cargando reservas…
      </p>
    } @else if (errorCarga) {
      <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        <p>{{ errorCarga }}</p>
        <button
          type="button"
          class="btn-secundario mt-3 rounded-lg px-5 py-2.5 text-sm font-semibold"
          (click)="cargarReservas()"
        >
          Volver a consultar
        </button>
      </div>
    } @else {
      <app-reservas-estadisticas [reservas]="reservas"></app-reservas-estadisticas>
      <app-reservas-filtros
        [textoBusqueda]="textoBusqueda"
        [filtro]="filtro"
        (busquedaCambiada)="actualizarBusqueda($event)"
        (filtroCambiado)="actualizarFiltro($event)"
      ></app-reservas-filtros>
      <div class="sticky top-4 z-30">
      @if (reservaPendienteCancelar) {
        <app-confirmacion-accion
          [titulo]="'¿Cancelar la reserva ' + reservaPendienteCancelar + '?'"
          mensaje="La reserva quedará cancelada. Esta acción no se puede deshacer desde esta pantalla."
          textoConfirmar="Sí, cancelar reserva"
          textoCancelar="No, volver"
          (confirmado)="confirmarCancelacion()"
          (cancelado)="descartarCancelacion()"
        ></app-confirmacion-accion>
      }
      @if (reservaPendienteActivar) {
        <app-confirmacion-accion
          [titulo]="'¿Activar la reserva ' + reservaPendienteActivar + '?'"
          mensaje="La reserva pasará a estar en curso."
          textoConfirmar="Sí, activar"
          textoCancelar="No, volver"
          (confirmado)="confirmarActivacion()"
          (cancelado)="reservaPendienteActivar = null"
        ></app-confirmacion-accion>
      }
      </div>
      <app-reservas-tabla
        [reservas]="reservasFiltradas"
        [cambiandoNumero]="cambiandoNumero"
        (activacionSolicitada)="activarReserva($event)"
        (cancelacionSolicitada)="cancelarReserva($event)"
      ></app-reservas-tabla>
    }
  </main>
</div>
