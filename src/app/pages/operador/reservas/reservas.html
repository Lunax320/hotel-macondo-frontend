<div class="flex min-h-screen flex-col bg-white text-[var(--texto)] md:flex-row">
  <app-operador-sidebar></app-operador-sidebar>

  <main class="min-w-0 flex-1 p-6 md:p-10">
    <header class="mb-8">
      <h1 class="font-serif text-3xl font-bold text-[var(--azul-oscuro)] md:text-4xl">Reservas</h1>
      <p class="mt-1 text-[var(--texto)]">Reservas registradas en el hotel y su estado actual.</p>
    </header>

    @if (mensajeAccion) {
      <p
        class="mb-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800"
        role="status"
      >
        {{ mensajeAccion }}
      </p>
    }

    @if (errorAccion) {
      <p
        class="mb-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800"
        role="alert"
      >
        {{ errorAccion }}
      </p>
      <button
        type="button"
        class="mb-5 font-semibold text-[var(--azul)] underline cursor-pointer"
        [disabled]="cargando || cambiandoNumero !== null"
        (click)="cargarReservas()"
      >
        Volver a consultar
      </button>
    }

    @if (cargando) {
      <p class="rounded-xl border border-gray-200 bg-white p-4 text-sm text-gray-600" role="status">
        Cargando reservas…
      </p>
    } @else if (errorCarga) {
      <div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        <p>{{ errorCarga }}</p>
        <button
          type="button"
          class="mt-3 font-semibold underline cursor-pointer"
          (click)="cargarReservas()"
        >
          Volver a consultar
        </button>
      </div>
    } @else {
      <app-reservas-estadisticas [reservas]="reservasFiltradas"></app-reservas-estadisticas>
      <app-reservas-filtros
        [textoBusqueda]="textoBusqueda"
        [filtro]="filtro"
        (busquedaCambiada)="actualizarBusqueda($event)"
        (filtroCambiado)="actualizarFiltro($event)"
      ></app-reservas-filtros>
      <app-reservas-tabla
        [reservas]="reservasFiltradas"
        [cambiandoNumero]="cambiandoNumero"
        (activacionSolicitada)="activarReserva($event)"
        (cancelacionSolicitada)="cancelarReserva($event)"
      ></app-reservas-tabla>
    }
  </main>
</div>
