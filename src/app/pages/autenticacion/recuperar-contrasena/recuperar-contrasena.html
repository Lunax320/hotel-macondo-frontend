<main class="min-h-[calc(100vh-76px)] bg-[var(--crema-claro)] flex items-center justify-center p-6">
  <section class="w-full max-w-[480px] rounded-[20px] bg-white p-8 md:p-10 shadow-[0_10px_30px_rgba(0,0,0,0.05)]">
    <div class="text-center mb-8">
      <img src="/images/logo.png" alt="Logo Hotel Macondo" class="mx-auto w-12 h-auto" />
      <h1 class="mt-4 text-2xl font-serif font-bold text-[var(--azul-oscuro)]">Recupera tu contraseña</h1>
      <p class="mt-3 text-sm leading-relaxed text-gray-600">
        Escribe el Gmail asociado a tu cuenta. Si está registrado, te enviaremos un enlace para crear una contraseña nueva.
      </p>
    </div>

    @if (mensaje) {
      <div class="mb-5 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status">
        {{ mensaje }}
      </div>
    }
    @if (error) {
      <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
        {{ error }}
      </div>
    }

    <form (ngSubmit)="solicitar()">
      <label for="correo" class="mb-2 block text-[var(--azul)] text-xs font-bold uppercase tracking-wider">Correo Gmail</label>
      <input
        id="correo"
        name="correo"
        type="email"
        required
        email
        [(ngModel)]="correo"
        placeholder="nombre@gmail.com"
        class="mb-5 w-full rounded-lg border border-gray-200 bg-gray-50 px-4 py-3 text-[var(--texto)] outline-none focus:border-[var(--azul)] focus:ring-2 focus:ring-[var(--azul)]/20"
      />
      <button
        type="submit"
        [disabled]="enviando || !correo"
        class="w-full rounded-lg border-2 border-[var(--dorado)] bg-[var(--dorado)] py-3 font-bold text-[var(--azul-oscuro)] transition hover:bg-[var(--dorado-oscuro)] disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ enviando ? 'Enviando…' : 'Enviar enlace de recuperación' }}
      </button>
    </form>

    <div class="mt-7 text-center text-sm">
      <a routerLink="/login" class="font-bold text-[var(--azul)] hover:underline">Volver a iniciar sesión</a>
    </div>
  </section>
</main>
