<div class="min-h-screen bg-gradient-to-b from-[#e3ecef] to-[#f5e6d3] flex flex-col font-sans">
  <app-navbar-cliente [clienteId]="clienteId"></app-navbar-cliente>

  <main class="flex-1 max-w-[900px] mx-auto w-full px-6 py-12">
    <div class="mb-8">
      <h1 class="font-serif text-3xl md:text-4xl font-bold text-[#0e2a3f] mb-2">Mi Perfil</h1>
      <p class="font-sans text-sm text-gray-500 m-0">
        Gestiona tu información personal y preferencias
      </p>
    </div>

    @if (cliente) {
      <app-perfil-resumen
        [nombreCompleto]="cliente.nombre + ' ' + cliente.apellido"
        [correo]="cliente.correo"
      ></app-perfil-resumen>
    }

    <!-- FORMULARIO DE DATOS PERSONALES -->
    <div class="bg-white rounded-[20px] p-8 shadow-[0_8px_32px_rgba(0,0,0,0.05)] mb-6">
      <div class="flex justify-between items-center mb-7">
        <div>
          <h3 class="font-serif text-xl font-bold text-[#0e2a3f] mb-1">Datos personales</h3>
          <p class="font-sans text-[0.78rem] text-gray-500 m-0">
            Información de tu cuenta y preferencias de contacto
          </p>
        </div>
      </div>

      <form (ngSubmit)="guardarDatos()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
          <div>
            <label
              class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
            >
              <i class="bi bi-person mr-1"></i> Nombre
            </label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="nombre"
              class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] text-gray-700 text-sm font-sans rounded-xl px-4 py-3 outline-none focus:border-[var(--azul)] focus:bg-white transition-all"
            />
          </div>

          <div>
            <label
              class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
            >
              <i class="bi bi-person mr-1"></i> Apellido
            </label>
            <input
              type="text"
              name="apellido"
              [(ngModel)]="apellido"
              class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] text-gray-700 text-sm font-sans rounded-xl px-4 py-3 outline-none focus:border-[var(--azul)] focus:bg-white transition-all"
            />
          </div>

          <div>
            <label
              class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
            >
              <i class="bi bi-envelope mr-1"></i> Correo electrónico
            </label>
            <input
              type="email"
              name="correo"
              [(ngModel)]="correo"
              class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] text-gray-700 text-sm font-sans rounded-xl px-4 py-3 outline-none focus:border-[var(--azul)] focus:bg-white transition-all"
            />
          </div>

          <div>
            <label
              class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
            >
              <i class="bi bi-telephone mr-1"></i> Teléfono
            </label>
            <input
              type="tel"
              name="telefono"
              [(ngModel)]="telefono"
              class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] text-gray-700 text-sm font-sans rounded-xl px-4 py-3 outline-none focus:border-[var(--azul)] focus:bg-white transition-all"
            />
          </div>
        </div>

        <div class="flex justify-end gap-3">
          <button
            type="submit"
            class="font-sans text-[0.85rem] font-bold bg-[var(--dorado)] text-[#333] border-none rounded-lg px-7 py-2.5 hover:bg-[#e6b43a] transition-all shadow-sm cursor-pointer"
          >
            Guardar cambios
          </button>
        </div>
      </form>
    </div>

    <!-- TARJETA DE CONTRASEÑA -->
    <div
      class="bg-white rounded-[20px] p-8 shadow-[0_8px_32px_rgba(0,0,0,0.05)] border-t-4 border-[var(--dorado)] mb-6"
    >
      <div class="flex justify-between items-center mb-7">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <i class="bi bi-key text-[var(--dorado)] text-lg"></i>
            <h3 class="font-serif text-xl font-bold text-[#0e2a3f] m-0">Cambiar contraseña</h3>
          </div>
          <p class="font-sans text-[0.78rem] text-gray-500 m-0">
            Actualiza tu contraseña de acceso al portal
          </p>
        </div>
      </div>

      <form (ngSubmit)="cambiarPassword()" class="flex flex-col gap-5 max-w-[420px]">
        <div>
          <label
            class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
          >
            Contraseña actual
          </label>
          <input
            type="password"
            name="contrasenaActual"
            [(ngModel)]="contrasenaActual"
            class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] rounded-xl px-4 py-3"
            required
          />
        </div>

        <div>
          <label
            class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
          >
            Nueva contraseña
          </label>
          <input
            type="password"
            name="nuevaContrasena"
            [(ngModel)]="nuevaContrasena"
            class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] rounded-xl px-4 py-3"
            required
          />
        </div>

        <div>
          <label
            class="block font-sans text-[0.7rem] font-bold text-[var(--azul)] mb-1.5 uppercase tracking-wider"
          >
            Confirmar contraseña
          </label>
          <input
            type="password"
            name="confirmarContrasena"
            [(ngModel)]="confirmarContrasena"
            class="w-full bg-[#faf8f6] border-[1.5px] border-[rgba(26,117,159,0.2)] rounded-xl px-4 py-3"
            required
          />
        </div>

        <button
          type="submit"
          class="font-sans text-sm font-semibold text-[var(--azul)] bg-transparent border-[1.5px] border-[var(--azul)] rounded-lg px-4 py-2 flex items-center gap-2 hover:bg-[var(--azul)] hover:text-white transition-colors cursor-pointer w-fit"
        >
          <i class="bi bi-pencil-square"></i> Cambiar
        </button>
      </form>
    </div>

    <!-- ZONA DE PELIGRO -->
    <div class="bg-[#fff8f8] border border-[#fde8e8] rounded-[20px] p-8 shadow-sm">
      <h3 class="font-serif text-lg font-bold text-[#c0392b] mb-2">Zona de peligro</h3>
      <p class="font-sans text-[0.78rem] text-gray-500 mb-4">
        Estas acciones son irreversibles. Por favor, procede con cuidado.
      </p>
      <button
        type="button"
        (click)="eliminarCuenta()"
        class="inline-block font-sans text-[0.8rem] font-semibold bg-transparent text-[#e74c3c] border-[1.5px] border-[#e74c3c] rounded-lg px-5 py-2.5 hover:bg-[#e74c3c] hover:text-white transition-colors cursor-pointer"
      >
        Eliminar mi cuenta
      </button>
    </div>
  </main>
</div>
