@if (servicio(); as servicioActual) {
  <article class="overflow-hidden rounded-lg bg-white shadow-[0_10px_25px_rgba(30,58,70,0.10)]">
    <div class="relative h-44 overflow-hidden">
      <img
        class="h-full w-full object-cover transition duration-500 hover:scale-105"
        [src]="servicioActual.imagen"
        [alt]="servicioActual.nombre"
      />
      <span
        class="absolute left-3 top-3 rounded-full bg-white px-3 py-1 text-[10px] font-bold uppercase text-[#147ba5]"
      >
        {{ servicioActual.categoria }}
      </span>
    </div>
    <div class="p-5">
      <h3 class="font-['Playfair_Display'] text-xl font-bold text-[#162f3b]">
        {{ servicioActual.nombre }}
      </h3>
      <p class="mt-2 text-sm leading-6 text-gray-600">{{ servicioActual.descripcion }}</p>
      <a
        class="mt-3 inline-flex items-center gap-2 font-bold text-[#147ba5] hover:underline"
        [routerLink]="['/servicios', servicioActual.id]"
      >
        Ver más <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </a>
    </div>
  </article>
}
