<section
  id="servicios"
  class="relative h-[100svh] min-h-[760px] w-full overflow-hidden bg-[#050e18] md:h-[90vh] md:min-h-[720px]"
>
  <div class="relative w-full h-full">
    @for (servicio of servicios; track servicio.id; let i = $index) {
      <div
        class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
        [class.opacity-100]="slideActual === i"
        [class.z-10]="slideActual === i"
        [class.opacity-0]="slideActual !== i"
        [class.z-0]="slideActual !== i"
      >
        <img [src]="servicio.imagen" [alt]="servicio.nombre" class="w-full h-full object-cover" />

        <div
          class="absolute inset-0 bg-gradient-to-r from-[#050e18]/95 via-[#050e18]/60 to-transparent"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-t from-[#050e18]/80 via-transparent to-transparent"
        ></div>

        <div
          class="absolute inset-0 flex flex-col justify-center px-8 pb-28 pt-8 md:px-16 md:pb-36 lg:px-24"
        >
          <h2
            class="text-4xl md:text-5xl lg:text-7xl font-serif font-bold text-white mb-6 tracking-wide"
          >
            Nuestros Servicios
          </h2>

          <span
            class="inline-block bg-[var(--dorado)]/20 text-[var(--dorado)] border border-[var(--dorado)]/40 text-[0.7rem] font-bold tracking-widest uppercase px-4 py-1 rounded-full mb-4 w-max"
          >
            Destacado
          </span>

          <h3
            class="font-serif text-2xl md:text-3xl font-bold mb-4 text-[var(--dorado)] uppercase tracking-widest"
          >
            {{ servicio.nombre }}
          </h3>
          <p class="text-gray-300 mb-8 text-lg md:text-xl max-w-xl leading-relaxed">
            {{ servicio.descripcion }}
          </p>

          <div class="flex flex-wrap gap-4">
            <a
              routerLink="/servicios"
              class="bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold px-8 py-3 rounded-lg hover:bg-white transition shadow-[0_4px_20px_rgba(249,199,79,0.3)]"
            >
              Explorar servicio
            </a>
            <a
              routerLink="/servicios"
              class="bg-transparent text-white font-bold px-8 py-3 rounded-lg border-2 border-white hover:bg-white hover:text-[var(--azul-oscuro)] transition"
            >
              Ver todos
            </a>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Miniaturas -->
  <div
    class="absolute bottom-0 z-20 w-full overflow-x-auto border-t border-white/10 bg-[#050e18]/80 backdrop-blur-md"
    style="scrollbar-width: none"
  >
    <div class="mx-auto flex min-w-full w-max justify-center gap-4 px-4 py-4 md:px-16">
      @for (servicio of servicios; track servicio.id; let i = $index) {
        <button
          type="button"
          class="relative h-16 w-28 flex-shrink-0 cursor-pointer overflow-hidden rounded-lg border-2 transition-all md:h-20 md:w-36"
          [class.border-[var(--dorado)]]="slideActual === i"
          [class.opacity-100]="slideActual === i"
          [class.scale-105]="slideActual === i"
          [class.border-transparent]="slideActual !== i"
          [class.opacity-50]="slideActual !== i"
          (click)="cambiarSlide(i)"
        >
          <img [src]="servicio.imagen" [alt]="servicio.nombre" class="h-full w-full object-cover" />
          <div class="absolute inset-0 bg-black/40"></div>
          <span
            class="absolute bottom-1 left-2 w-[90%] truncate text-left text-[0.65rem] font-bold text-white md:text-xs"
          >
            {{ servicio.nombre }}
          </span>
        </button>
      }
    </div>
  </div>
</section>
