@if (tipoHabitacion(); as tipo) {
  <article
    class="bg-white rounded-[16px] overflow-hidden shadow-[0_8px_24px_rgba(0,0,0,0.08)] hover:shadow-[0_16px_34px_rgba(0,0,0,0.16)] hover:-translate-y-2 transition-all duration-300 relative flex flex-col h-full"
  >
    <img [src]="tipo.imagen" class="h-[200px] w-full object-cover" [alt]="tipo.nombre" />

    <span
      class="absolute top-[14px] left-[14px] bg-[var(--dorado)] text-[var(--azul-oscuro)] text-[0.7rem] font-bold tracking-[1px] px-[0.8rem] py-[0.3rem] rounded-[20px]"
    >
      Hasta {{ tipo.capacidadPersonas }} huéspedes
    </span>

    <div class="p-5 flex flex-col flex-grow">
      <h3 class="font-serif text-xl font-bold text-[var(--azul-oscuro)] mb-2">
        {{ tipo.nombre }}
      </h3>
      <p class="text-[var(--texto)] flex-grow mb-6 text-[0.95rem]">
        {{ tipo.descripcion }}
      </p>

      <div class="flex justify-between items-end mt-auto">
        <div>
          <small class="uppercase text-gray-400 text-xs font-bold">Desde</small><br />
          <span class="font-serif text-[1.4rem] font-bold text-[var(--azul-oscuro)]">
            ${{ tipo.precioNoche.toLocaleString('es-CO') }}
          </span>
          <small class="text-gray-400 text-xs">/noche</small>
        </div>
        <a
          [routerLink]="['/habitaciones', tipo.id]"
          class="border-2 border-[var(--azul)] text-[var(--azul)] font-bold rounded-[10px] px-4 py-2 hover:bg-[var(--azul)] hover:text-white transition text-sm"
        >
          Ver más
        </a>
      </div>
    </div>
  </article>
}
