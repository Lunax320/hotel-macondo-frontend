<section class="text-center py-24 bg-gradient-to-b from-[#fffdf6] to-[var(--dorado)]">
  <div class="container mx-auto px-4 flex flex-col items-center">
    <div class="[&>img]:w-[60px] [&>img]:h-[60px] mb-4">
      <img src="/images/logo.png" alt="Logo Hotel Macondo" class="w-16 h-auto object-contain" />
    </div>
    <h2 class="mt-4 mb-4 text-4xl md:text-[4rem] font-serif font-bold text-[var(--azul-oscuro)]">
      ¿Listo para tu escapada?
    </h2>
    <p class="max-w-xl mx-auto text-[var(--azul-oscuro)] mb-8 text-lg">
      El mar te espera. Déjate envolver por la magia del Caribe colombiano en un hotel que nació de
      los sueños de García Márquez.
    </p>

    <div class="flex justify-center gap-4 flex-wrap">
      <a
        routerLink="/habitaciones"
        class="bg-[var(--azul)] text-white font-bold rounded-[10px] px-8 py-3 border-2 border-[var(--azul)] hover:bg-[var(--azul-oscuro)] hover:border-[var(--azul-oscuro)] transition text-lg"
      >
        Ver Habitaciones
      </a>
      <a
        routerLink="/habitaciones"
        class="bg-transparent text-[var(--azul-oscuro)] font-bold px-8 py-3 rounded-[10px] border-2 border-[var(--azul-oscuro)] hover:bg-white hover:text-[var(--azul-oscuro)] transition text-lg"
      >
        Reservar Ahora
      </a>
    </div>
  </div>
</section>
