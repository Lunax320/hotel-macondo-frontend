<section class="border-t-4 border-[#d8ba80] bg-gradient-to-b from-[#f6ebd8] to-[#fff9ee] py-16 sm:py-20">
  <div class="container mx-auto px-4">
    <div class="text-center mb-16">
      <p class="text-[var(--azul)] text-[0.8rem] font-bold tracking-[3px] uppercase block mb-2">
        Nuestros huéspedes
      </p>
      <h2 class="text-4xl md:text-5xl font-serif font-bold text-[var(--azul-oscuro)]">
        Historias que perduran
      </h2>
    </div>

    <div
      class="carrusel mx-auto max-w-6xl"
      role="region"
      aria-roledescription="carrusel"
      aria-label="Testimonios de huéspedes"
      (mouseenter)="pausado = true"
      (mouseleave)="pausado = false"
      (focusin)="pausado = true"
      (focusout)="pausado = false"
    >
      <div class="flex items-center gap-2 md:gap-4">
        <button type="button" class="flecha" aria-label="Testimonios anteriores" (click)="mover(-1)">
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>

        <div class="ventana flex-1 overflow-hidden py-3">
          <div
            class="pista"
            [style.width]="anchoPista()"
            [style.transform]="desplazamiento()"
          >
            @for (testimonio of lista; track $index; let i = $index) {
              <div
                class="slide"
                role="group"
                aria-roledescription="diapositiva"
                [style.flex]="'0 0 ' + anchoSlide()"
                [attr.aria-label]="i + 1 + ' de ' + lista.length"
              >
                <app-testimonio-card [testimonio]="testimonio"></app-testimonio-card>
              </div>
            }
          </div>
        </div>

        <button type="button" class="flecha" aria-label="Testimonios siguientes" (click)="mover(1)">
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="flex justify-center gap-2 mt-6">
        @for (posicion of posiciones; track posicion) {
          <button
            type="button"
            class="punto"
            [class.activo]="posicion === indice"
            [attr.aria-label]="'Ir a la posición ' + (posicion + 1)"
            [attr.aria-current]="posicion === indice ? 'true' : null"
            (click)="ir(posicion)"
          ></button>
        }
      </div>
    </div>
  </div>
</section>
