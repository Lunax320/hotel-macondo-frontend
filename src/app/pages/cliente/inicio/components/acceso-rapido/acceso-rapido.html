<section class="mt-12">
  <h2 class="font-serif text-2xl font-bold text-[var(--azul-oscuro)]">Acceso rápido</h2>
  <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
    @for (t of tarjetas(); track t.nombre) {
      <a
        class="group flex flex-col rounded-[18px] border-2 border-transparent bg-white p-6 shadow-[0_10px_25px_rgba(30,58,70,0.10)] transition hover:-translate-y-1 hover:border-[var(--dorado)] hover:shadow-[0_16px_32px_rgba(30,58,70,0.18)] focus-visible:-translate-y-1 focus-visible:border-[var(--azul)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--azul)]"
        [routerLink]="t.ruta"
      >
        <span class="flex items-start justify-between">
          <span class="flex h-12 w-12 items-center justify-center rounded-xl text-2xl {{ t.color }}"
            ><i class="bi {{ t.icono }}" aria-hidden="true"></i
          ></span>
          <i
            class="bi bi-arrow-right text-xl text-[var(--azul)] opacity-40 transition group-hover:translate-x-1 group-hover:opacity-100 group-focus-visible:opacity-100"
            aria-hidden="true"
          ></i>
        </span>
        <h3 class="mt-5 font-serif text-xl font-bold text-[var(--azul-oscuro)]">{{ t.nombre }}</h3>
        <p class="mt-1 text-sm">{{ t.descripcion }}</p>
        <p class="mt-3 text-sm font-bold text-[var(--azul)]">{{ t.dato }}</p>
      </a>
    }
  </div>
</section>
