<section
  class="flex flex-col justify-between gap-5 border-b border-gray-300 pb-9 md:flex-row md:items-start"
>
  <div>
    <p class="text-[15px]">Bienvenida de vuelta,</p>
    <h1 class="mt-3 font-serif text-5xl font-bold text-[var(--azul-oscuro)]">
      {{ nombre() }} {{ apellido() }}
    </h1>
  </div>
  <div class="text-left text-sm md:text-right">
    <p>{{ fechaActual() }}</p>
    <a
      class="mt-3 inline-block font-bold text-[var(--azul)] hover:underline"
      [routerLink]="rutaPerfil()"
      >Ver perfil <i class="bi bi-arrow-right"></i
    ></a>
  </div>
</section>
