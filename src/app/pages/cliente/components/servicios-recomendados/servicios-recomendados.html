<section class="mt-12">
  <div class="flex items-center justify-between gap-4">
    <h2 class="font-serif text-2xl font-bold text-[var(--azul-oscuro)]">Servicios recomendados</h2>
    <a class="font-bold text-[var(--azul)] hover:underline" routerLink="/servicios"
      >Ver todos <i class="bi bi-arrow-right"></i
    ></a>
  </div>
  <div class="mt-6 space-y-5">
    @for (servicio of recomendaciones(); track servicio.id) {
      <article
        class="grid overflow-hidden rounded-[18px] bg-white shadow-[0_10px_25px_rgba(30,58,70,0.10)] md:grid-cols-[280px_minmax(0,1fr)]"
      >
        <img
          class="h-48 w-full object-cover md:h-full"
          [src]="servicio.imagen"
          [alt]="servicio.nombre"
        />
        <div class="p-6 md:p-7">
          <span
            class="rounded-md bg-[#edf6f9] px-3 py-1 text-[11px] font-bold uppercase tracking-[1px] text-[var(--azul)]"
            >{{ servicio.categoria }}</span
          >
          <h3 class="mt-4 font-serif text-2xl font-bold text-[var(--azul-oscuro)]">
            {{ servicio.nombre }}
          </h3>
          <p class="mt-3 leading-7">{{ servicio.descripcion }}</p>
          <a
            class="mt-4 inline-flex items-center gap-2 font-bold text-[var(--azul)] hover:underline"
            [routerLink]="['/servicios', servicio.id]"
            >Reservar <i class="bi bi-arrow-right"></i
          ></a>
        </div>
      </article>
    }
  </div>
</section>
