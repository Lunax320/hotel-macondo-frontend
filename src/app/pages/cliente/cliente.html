<div class="min-h-screen bg-[#eef3f3] text-[var(--texto)] font-sans">
  <app-navbar-cliente [clienteId]="clienteId"></app-navbar-cliente>
  <main class="mx-auto max-w-[1180px] px-5 py-10 md:py-12">
    @if (mensajeError) {
      <div class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-700">
        {{ mensajeError }}
      </div>
    } @else if (cliente; as clienteActual) {
      <app-cliente-saludo
        [nombre]="clienteActual.nombre"
        [apellido]="clienteActual.apellido"
        [fechaActual]="fechaActual"
        [clienteId]="clienteId"
      ></app-cliente-saludo>

      @if (reservaActiva; as reserva) {
        <app-reserva-activa-card
          [reserva]="reserva"
          [habitacionActiva]="habitacionActiva"
          [noches]="nochesReserva(reserva)"
          [clienteId]="clienteId"
        ></app-reserva-activa-card>
      } @else {
        <app-reserva-activa-vacia [clienteId]="clienteId"></app-reserva-activa-vacia>
      }

      <app-acceso-rapido
        [clienteId]="clienteId"
        [cantidadActivas]="cantidadActivas"
        [cantidadHistorial]="cantidadHistorial"
      ></app-acceso-rapido>

      <app-servicios-recomendados [recomendaciones]="recomendaciones"></app-servicios-recomendados>
    }
  </main>
</div>
