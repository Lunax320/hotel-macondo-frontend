<section class="min-h-[70vh] bg-[var(--crema-claro)] px-5 py-12 md:py-16">
  <div class="mx-auto max-w-[1100px]">
    @if (!clienteEncontrado) {
      <app-alerta-mensaje mensaje="No se encontró el cliente."></app-alerta-mensaje>
    } @else {
      @if (cliente; as clienteActual) {
        <app-cliente-encabezado [nombre]="clienteActual.nombre"></app-cliente-encabezado>
        <div class="grid grid-cols-1 gap-8 lg:grid-cols-[360px_1fr]">
          <app-cliente-datos-form
            [cliente]="clienteActual"
            [mensajeExito]="mensajeExito"
            (guardado)="guardarCambios($event)"
          ></app-cliente-datos-form>
          <div class="min-w-0 space-y-10">
            @if (reservaPendienteCancelar; as reserva) {
              <app-confirmacion-accion
                [titulo]="'¿Cancelar la reserva ' + reserva.numeroReserva + '?'"
                mensaje="La habitación quedará libre para esas fechas."
                textoConfirmar="Confirmar cancelación"
                textoCancelar="Volver"
                (confirmado)="confirmarCancelacion()"
                (cancelado)="volver()"
              ></app-confirmacion-accion>
            }
            <app-reservas-activas
              [reservas]="reservasActivas"
              (cancelacionSolicitada)="solicitarCancelacion($event)"
            ></app-reservas-activas
            ><app-reservas-historial [reservas]="reservasPasadas"></app-reservas-historial>
          </div>
        </div>
      }
    }
  </div>
</section>
