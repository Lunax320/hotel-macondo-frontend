<nav
  class="flex min-h-screen w-full flex-col justify-between bg-[var(--azul-oscuro)] p-6 text-white md:w-64"
  aria-label="Portal Operador"
>
  <div>
    <a class="mb-10 flex items-center gap-3" routerLink="/">
      <img class="h-auto w-10" src="/images/logo.png" alt="Logo Hotel Macondo" />
      <span class="font-serif text-xl font-bold text-[var(--dorado)]">Macondo</span>
    </a>

    <p class="mb-4 text-[0.7rem] uppercase tracking-[3px] text-white/50">Portal Operador</p>

    <a
      class="mb-1 block rounded-lg px-4 py-3 transition hover:bg-white/10"
      routerLink="/operador"
      routerLinkActive="bg-[var(--dorado)] font-bold text-[var(--azul-oscuro)] hover:bg-[var(--dorado)]"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <i class="bi bi-grid mr-2" aria-hidden="true"></i>
      Panel Principal
    </a>

    <div class="flex flex-col gap-1">
      <a
        class="rounded-lg px-4 py-3 transition hover:bg-white/10"
        routerLink="/operador/reservas"
        routerLinkActive="bg-[var(--dorado)] font-bold text-[var(--azul-oscuro)] hover:bg-[var(--dorado)]"
        ariaCurrentWhenActive="page"
      >
        <i class="bi bi-journal-text mr-2" aria-hidden="true"></i>
        Reservas
      </a>
      <a class="rounded-lg px-4 py-3 transition hover:bg-white/10" routerLink="/operador/cuenta">
        <i class="bi bi-receipt mr-2" aria-hidden="true"></i>
        Cuenta Habitación
      </a>
      <a class="rounded-lg px-4 py-3 transition hover:bg-white/10" routerLink="/operador/checkout">
        <i class="bi bi-box-arrow-right mr-2" aria-hidden="true"></i>
        Check-out
      </a>
    </div>

    <a class="mt-10 block text-sm text-white/60 transition hover:text-[var(--dorado)]" routerLink="/">
      <i class="bi bi-arrow-left mr-1" aria-hidden="true"></i>
      Volver al sitio
    </a>
  </div>

  <a
    class="mt-10 block rounded-lg border border-white/20 px-4 py-2.5 text-center text-sm text-white/70 transition hover:bg-white/10 hover:text-white"
    routerLink="/login"
  >
    <i class="bi bi-power mr-2" aria-hidden="true"></i>
    Cerrar sesión
  </a>
</nav>
