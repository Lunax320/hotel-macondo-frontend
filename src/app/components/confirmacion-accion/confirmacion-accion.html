<div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-5 py-4 text-amber-900">
  <p class="font-bold">{{ titulo() }}</p>
  <p class="mt-1 text-sm">{{ mensaje() }}</p>
  <div class="mt-4 flex flex-wrap gap-3">
    <button
      class="rounded-lg bg-red-600 px-5 py-2 font-bold text-white hover:bg-red-700"
      type="button"
      (click)="confirmado.emit()"
    >
      {{ textoConfirmar() }}</button
    ><button
      class="rounded-lg border border-[var(--azul)] px-5 py-2 font-bold text-[var(--azul)]"
      type="button"
      (click)="cancelado.emit()"
    >
      {{ textoCancelar() }}
    </button>
  </div>
</div>
