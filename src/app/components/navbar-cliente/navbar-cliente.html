<header class="bg-white shadow-md sticky top-0 z-50 py-4">
  <div class="container mx-auto px-4 flex flex-wrap justify-between items-center">
    <!-- Logo -->
    <a
      class="flex items-center gap-3 font-serif text-xl font-bold text-[var(--azul)]"
      [routerLink]="['/cliente', clienteId()]"
    >
      <img class="h-11 w-11 object-contain" src="/images/logo.png" alt="Logo Hotel Macondo" />
      Hotel Macondo
    </a>

    <!-- Enlaces -->
    <ul class="hidden md:flex gap-6 font-sans text-gray-600 font-medium">
      <li>
        <a class="hover:text-[var(--azul)] transition" [routerLink]="['/cliente', clienteId()]"
          >Inicio</a
        >
      </li>
      <li>
        <a
          class="hover:text-[var(--azul)] transition"
          [routerLink]="['/cliente', clienteId(), 'reservas']"
          >Mis Reservas</a
        >
      </li>
      <li>
        <a
          class="hover:text-[var(--azul)] transition"
          [routerLink]="['/cliente', clienteId(), 'historial']"
          >Historial</a
        >
      </li>
      <li>
        <a
          class="hover:text-[var(--azul)] transition"
          [routerLink]="['/cliente', clienteId(), 'pagos']"
          >Pagos</a
        >
      </li>
      <li>
        <a
          class="hover:text-[var(--azul)] transition"
          [routerLink]="['/habitaciones']"
          [queryParams]="{ clienteId: clienteId() }"
          >Habitaciones</a
        >
      </li>
      <li>
        <a
          class="hover:text-[var(--azul)] transition"
          [routerLink]="['/cliente', clienteId(), 'reservas', 'nueva']"
          >Nueva Reserva</a
        >
      </li>
      <li>
        <a class="hover:text-[var(--azul)] transition" routerLink="/servicios">Servicios</a>
      </li>
    </ul>

    <!-- Botones -->
    <div class="hidden md:flex items-center gap-3 font-sans text-sm">
      <a
        class="border-2 border-[var(--azul)] text-[var(--azul)] font-semibold px-4 py-2 rounded-lg hover:bg-[var(--azul)] hover:text-white transition"
        [routerLink]="['/cliente', clienteId(), 'perfil']"
        >Mi Perfil</a
      >
      <a
        class="bg-[var(--dorado)] text-[var(--azul-oscuro)] font-bold px-5 py-2 rounded-lg hover:bg-[var(--dorado-oscuro)] transition cursor-pointer"
        routerLink="/login"
        >Cerrar sesión</a
      >
    </div>

    <!-- Menú móvil -->
    <button class="md:hidden text-2xl text-[var(--azul)] focus:outline-none">
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>
